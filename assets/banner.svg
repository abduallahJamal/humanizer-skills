      <rect x="882" y="210" width="5" height="90" rx="2.5" fill="#22C55E"/>
      <text x="906" y="245" font-size="17.5" font-weight="700" fill="#E2E8F0">academic-humanizer</text>
      <text x="906" y="273" font-size="12.5" fill="#94A3B8">Citation &amp; Digit Lock · Diff</text>
    </g>
